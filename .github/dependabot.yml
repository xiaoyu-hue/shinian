version: 2
updates:
  # 依赖漏洞自动修复 PR（npm 生态，含 Capacitor / 生物锁插件 / 构建工具链）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # 冷却 7 天：过滤刚发布的新版本（易出坏版本），顺带满足 Semgrep 加固建议
    cooldown:
      default-days: 7
    # 同生态的多个依赖更新合并进同一个 PR，最多每周一个分支
    groups:
      npm-all:
        patterns:
          - "*"
  # GitHub Actions 自身版本更新（防止 CI action 漂移）
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
      - "security"
    cooldown:
      default-days: 7
    # 上次 5 个 action 同时更新开出 5 个分支的根源即未分组；分组后每周最多 1 个 PR
    groups:
      actions-all:
        patterns:
          - "*"
