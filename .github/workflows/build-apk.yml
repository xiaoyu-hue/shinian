name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK 类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# 默认 GITHUB_TOKEN 即可（上传 artifact / 建 Release 用），无需额外权限提升。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Java (用于 Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm ci

      - name: 运行自动化测试（质量门）
        run: npm test

      - name: 发布态构建 (www/)
        run: npm run build:release

      - name: 注入 Capacitor Android 平台（首次生成 android/）
        run: test -d android || npx cap add android

      - name: 同步 Web 资源到原生工程
        run: npx cap sync android

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 编译依赖（与 Capacitor 6 的 compileSdk 对齐）
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 构建 Debug APK（验证通道，无需签名）
        if: ${{ inputs.build_type == 'debug' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release APK（签名，密钥仅来自 Secrets）
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          # 将签名配置写入 gradle（仅内存/临时文件，不入库）
          cat >> app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file("release-key.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes.release.signingConfig = signingConfigs.release
          }
          GRADLE
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: shinian-${{ inputs.build_type }}-apk
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/**/*.apk
          if-no-files-found: error
