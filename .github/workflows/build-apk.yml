name: 构建 Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'APK 上传到哪个 Release（tag 名，如 v0.3.0）'
        required: true
        default: 'v0.3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm install

      - name: 构建 Web 资源
        run: npm run build

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 应用专属图标与启动画面
        run: cp -rv resources/android/res/. android/app/src/main/res/

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: 验证 APK 文件
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: 重命名 APK（带版本号）
        run: mv android/app/build/outputs/apk/debug/app-debug.apk shinian-${{ github.event.inputs.release_tag }}-debug.apk

      - name: 上传 APK 到指定 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.inputs.release_tag }} shinian-${{ github.event.inputs.release_tag }}-debug.apk \
            --repo ${{ github.repository }} \
            --clobber
