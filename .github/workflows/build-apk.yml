name: 构建 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm install

      - name: 构建 Web 资源
        run: npm run build

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: 上传 APK 到 v0.1.0 Release
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0 \
            | jq -r '.id')
          echo "Release ID: $RELEASE_ID"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=时念-ShiNian-v0.1.0.apk" \
            | jq -r '.browser_download_url'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}