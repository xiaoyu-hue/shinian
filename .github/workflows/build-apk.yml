name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK 类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# 默认 GITHUB_TOKEN 即可（上传 artifact / 建 Release 用），无需额外权限提升。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 配置 Java (用于 Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm ci

      - name: 运行自动化测试（质量门）
        run: npm test

      - name: 类型检查（ts-check 门，守护既有 vanilla + 新 TS 模块）
        run: npm run typecheck

      - name: 发布态构建 (www/)
        run: npm run build:release

      - name: 注入 Capacitor Android 平台（首次生成 android/）
        run: test -d android || npx cap add android

      - name: 同步 Web 资源到原生工程
        run: npx cap sync android

      # 不使用 android-actions/setup-android@v3：其默认 packages 含已废弃的 `tools` 包，
      # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并退出码 1。
      # ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 直接用其自带的 sdkmanager 接受许可证并补齐编译依赖即可（已装的自动跳过）。
      - name: 配置 Android SDK 与许可证
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          # 同一步骤内必须 export 才生效（>> $GITHUB_PATH 仅对后续步骤生效）
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          # 确保原生工程能定位 SDK（local.properties 在 gitignore 的 android/ 内，不入库）
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 构建 Debug APK（验证通道，无需签名）
        if: ${{ inputs.build_type == 'debug' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release APK（签名，密钥仅来自 Secrets）
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          # 将签名配置写入 gradle（仅内存/临时文件，不入库）
          cat >> app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file("release-key.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes.release.signingConfig = signingConfigs.release
          }
          GRADLE
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v6
        with:
          name: shinian-${{ inputs.build_type }}-apk
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/**/*.apk
          if-no-files-found: error
