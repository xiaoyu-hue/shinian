name: 构建 Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'APK 上传到哪个 Release（tag 名，如 v0.6.1）'
        required: true
        default: 'v0.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm install

      - name: 运行自动化测试
        run: npm test

      # 发布态构建：esbuild 把 src/（加密保险库 + 生物锁桥接）编译为 www/assets/shinian-core.min.js，
      # 并把 12 个 vanilla 脚本混淆打包为 www/assets/bundle.min.js；www/ 即 Capacitor 的 webDir，
      # 必须由 cap sync 拷入 APK 的 assets。漏跑此步会导致 APK 不含加密层 / 生物锁。
      - name: 发布态构建（生成 www/）
        run: npm run build:release

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 应用专属图标与启动画面
        run: cp -rv resources/android/res/. android/app/src/main/res/

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      # B4 · WebView / Android 硬化：cap sync 生成的清单基础上补安全配置（发布态强制）
      #   - allowBackup=false：禁止 adb backup 导出应用私有数据（保险库密文不随备份泄露）
      #   - debuggable=false：发布包关闭调试桥
      #   - usesCleartextTraffic=false + network_security_config：禁用明文流量、拒绝用户证书 MITM
      #   - WebView.EnableSafeBrowsing=true：开启安全浏览防护
      #   - 生物锁权限（USE_BIOMETRIC）确保注入（插件通常会自动加，这里兜底）
      - name: B4 · 注入 Android 清单加固
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          echo ">> 原始 Manifest 头部："; sed -n '1,20p' "$MAN"
          # 在 <application 标签上追加加固属性（若已存在则跳过，避免重复）
          python3 - <<'PY'
          import re, io
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          app_tag = re.search(r'<application\b', s)
          if not app_tag:
              raise SystemExit("未找到 <application> 标签")
          attrs = {
              'android:allowBackup': 'false',
              'android:debuggable': 'false',
              'android:usesCleartextTraffic': 'false',
              'android:networkSecurityConfig': '@xml/network_security_config',
          }
          for k, v in attrs.items():
              if re.search(re.escape(k) + r'=', s):
                  print(f"  已存在 {k}，跳过")
                  continue
              s = s[:app_tag.end()] + f' {k}="{v}"' + s[app_tag.end():]
              print(f"  注入 {k}={v}")
          # 兜底注入生物锁权限（插件通常会自动加）
          if 'android.permission.USE_BIOMETRIC' not in s:
              s = s.replace('</manifest>',
                  '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>')
              print("  注入 USE_BIOMETRIC 权限")
          # 注入 WebView 安全浏览 meta-data（放进 <application> 内）
          if 'WebView.EnableSafeBrowsing' not in s:
              s = re.sub(r'(<application\b[^>]*>)',
                  r'\1\n        <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="true" />',
                  s, count=1)
              print("  注入 WebView.EnableSafeBrowsing")
          open(p, "w", encoding="utf-8").write(s)
          PY
          echo ">> 加固后 Manifest 头部："; sed -n '1,24p' "$MAN"

      - name: B4 · 写入网络安全配置（禁明文 / 拒用户证书）
        run: |
          set -e
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <!-- 发布态基线：禁用明文流量，且不信任用户/调试证书（防 MITM） -->
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors>
                <certificates src="system" />
              </trust-anchors>
            </base-config>
            <!-- 仅天气 API 走 HTTPS；其余域名一律拒绝 -->
            <domain-config cleartextTrafficPermitted="false">
              <domain includeSubdomains="true">api.open-meteo.com</domain>
            </domain-config>
          </network-security-config>
          XML
          echo ">> 已写入 network_security_config.xml"

      # 签名准备：仅在仓库配置了 KEYSTORE_BASE64 等 Secrets 时才走正式签名包
      - name: 准备签名（如配置了 Secrets）
        id: sign
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_sign=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 构建 Release APK（已签名 · 正式包）
        if: steps.sign.outputs.has_sign == '1'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 容错降级：未配置签名时仍产出可安装的 Debug APK（用 debug 签名）
      - name: 构建 Debug APK（未配置签名时的可安装降级包）
        if: steps.sign.outputs.has_sign != '1'
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: 重命名 APK（带版本号）
        run: |
          if [ "$SIGNED" = "1" ]; then
            mv android/app/build/outputs/apk/release/app-release.apk shinian-${{ github.event.inputs.release_tag }}-release.apk
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk shinian-${{ github.event.inputs.release_tag }}-debug.apk
          fi
          ls -lh shinian-${{ github.event.inputs.release_tag }}-*.apk
        env:
          SIGNED: ${{ steps.sign.outputs.has_sign }}

      - name: 上传 APK 到指定 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls shinian-${{ github.event.inputs.release_tag }}-*.apk | head -1)
          gh release upload ${{ github.event.inputs.release_tag }} "$APK" \
            --repo ${{ github.repository }} --clobber
