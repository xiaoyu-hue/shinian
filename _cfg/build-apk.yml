name: 构建 Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'APK 上传到哪个 Release（tag 名，如 v0.6.1）'
        required: true
        default: 'v0.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装依赖
        run: npm install

      - name: 运行自动化测试
        run: npm test

      # 零构建结构（index.html 双击即用，无打包器）：网页静态资源由下方 cap sync 直接拷贝，
      # 无需、也不存在 npm run build 步骤；此前误写该步骤会导致 APK 流水线硬失败。

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 应用专属图标与启动画面
        run: cp -rv resources/android/res/. android/app/src/main/res/

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      # 签名准备：仅在仓库配置了 KEYSTORE_BASE64 等 Secrets 时才走正式签名包
      - name: 准备签名（如配置了 Secrets）
        id: sign
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_sign=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 构建 Release APK（已签名 · 正式包）
        if: steps.sign.outputs.has_sign == '1'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 容错降级：未配置签名时仍产出可安装的 Debug APK（用 debug 签名）
      - name: 构建 Debug APK（未配置签名时的可安装降级包）
        if: steps.sign.outputs.has_sign != '1'
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: 重命名 APK（带版本号）
        run: |
          if [ "$SIGNED" = "1" ]; then
            mv android/app/build/outputs/apk/release/app-release.apk shinian-${{ github.event.inputs.release_tag }}-release.apk
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk shinian-${{ github.event.inputs.release_tag }}-debug.apk
          fi
          ls -lh shinian-${{ github.event.inputs.release_tag }}-*.apk
        env:
          SIGNED: ${{ steps.sign.outputs.has_sign }}

      - name: 上传 APK 到指定 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls shinian-${{ github.event.inputs.release_tag }}-*.apk | head -1)
          gh release upload ${{ github.event.inputs.release_tag }} "$APK" \
            --repo ${{ github.repository }} --clobber
